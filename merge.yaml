  - RULE-SET,ChinaMax,DIRECT
  - GEOIP,CN,DIRECT
  - DOMAIN-SUFFIX,acgrip.com,DIRECT
  - DOMAIN-SUFFIX,mineru.net,DIRECT
  - DOMAIN-SUFFIX,openxlab.org.cn,DIRECT
  - RULE-SET,SteamCN,DIRECT
